name: Generate SBOM and CBOM

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-boms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create output directory
        run: mkdir -p oss

      # -------------------------------------------------------------
      # Step A: Container Build (Required if scanning container image)
      # -------------------------------------------------------------
      - name: Build Docker Image
        run: docker build -t my-app:local .

      # -------------------------------------------------------------
      # Step B: SBOM Generation (Syft via anchore/sbom-action)
      # -------------------------------------------------------------
      - name: Generate SBOM from Container Image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.16.1
        with:
          image: my-app:local
          format: spdx-json
          output-file: oss/sbom.spdx.json

      # -------------------------------------------------------------
      # Step C: CBOM Generation (cbomkit-action)
      # -------------------------------------------------------------
      - name: Generate CBOM with CBOMkit
        uses: cbomkit/cbomkit-action@34a3d960625ae7f7f1b59455eff93a96df090eb7 # v2.3.0
        id: cbom
        env:
          CBOMKIT_OUTPUT_DIR: oss
          CBOMKIT_EXCLUDE: "(^|/)scripts/.*|(^|/)tests/.*"

      - name: Fix permissions for container-generated artifacts
        run: sudo chown -R $(id -u):$(id -g) oss/ || true

      # -------------------------------------------------------------
      # Step D: Dual-Engine Semantic AST Crypto Call-Site Discovery & Reconciliation
      # -------------------------------------------------------------
      - name: Set up Python for Cryptographic Auditing
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Semantic AST Cryptographic Scan & CBOM Reconciliation
        run: |
          python3 scripts/scan_crypto_ast.py . \
            --cbom oss/cbom.json \
            --output-json oss/crypto-callsites.json

      # -------------------------------------------------------------
      # Step E: Automated Verification & Test Harness in CI
      # -------------------------------------------------------------
      - name: Run BOM Verification and Cryptographic Audit Harness
        run: bash scripts/test_boms.sh oss

      # -------------------------------------------------------------
      # Step F: Post-Quantum Cryptography (PQC) Readiness Assessment
      # -------------------------------------------------------------
      - name: Generate PQC Migration Dashboard & Step Summary
        run: |
          python3 scripts/analyze_cbom.py oss/cbom.json \
            --sbom oss/sbom.spdx.json \
            --json oss/crypto-analysis.json \
            --markdown oss/crypto-summary.md \
            --step-summary

      # -------------------------------------------------------------
      # Step G: Publish Cryptographic Audit Report to Repository (docs/security)
      # -------------------------------------------------------------
      - name: Publish Cryptographic Audit Report to Repository
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          if [ -f oss/crypto-summary.md ]; then
            mkdir -p docs/security
            cp oss/crypto-summary.md docs/security/CRYPTOGRAPHIC_AUDIT.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/security/CRYPTOGRAPHIC_AUDIT.md
            if git diff --staged --quiet; then
              echo "No changes in cryptographic audit report."
            else
              git commit -m "docs(security): update cryptographic audit & PQC migration report [skip ci]"
              git push
            fi
          fi

      # -------------------------------------------------------------
      # Step H: Upload Generated Artifacts
      # -------------------------------------------------------------
      - name: Upload BOM Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.3
        with:
          name: oss-boms
          path: oss/
          retention-days: 30

