name: ADR Gatekeeper

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main ]

jobs:
  verify-adr-compliance:
    name: Verify ADR Governance & ASR Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ADR Gatekeeper Analysis
        run: |
          chmod +x scripts/adr_gatekeeper.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/adr_gatekeeper.py ${{ github.base_ref }}
          else
            python3 scripts/adr_gatekeeper.py
          fi
