name: Software & Cryptographic Bill of Materials (SBOM & CBOM)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  generate-and-verify-boms:
    name: Generate, Verify, and Upload BOMs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Multi-Language SBOM, CBOM & PQC Governance
        uses: jsoehner/jsi-bom-actions@v1.1.0
        with:
          target-dir: '.'
          output-dir: 'oss'
          publish-audit-report: 'true'
          comment-pr: 'true'
          upload-artifacts: 'true'
          retention-days: '90'

      - name: Fetch OCI Image CBOM
        run: python3 scripts/fetch_oci_cbom.py docker.io/library/alpine:latest

      - name: Analyze CBOM & PQC Risk
        run: python3 scripts/analyze_cbom.py oss/cbom.cyclonedx.json -o oss/pqc_risk_report.md

      - name: Enrich Python SBOM
        run: python3 scripts/enrich_sbom_python.py oss/sbom.cyclonedx.json .
