name: Generate SBOM and CBOM
 
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  generate-boms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0

      - name: Create output directory
        run: mkdir -p oss

      # -------------------------------------------------------------
      # Step A: Setup Tooling (ORAS CLI for OCI 1.1 Artifact Discovery & Attachment)
      # -------------------------------------------------------------
      - name: Setup ORAS CLI (OCI 1.1 Registry as Storage)
        uses: oras-project/setup-oras@b556b63ca0e0fcbfa4e27f4f6d0f1a995e8e89ef # v1.2.2

      - name: Set up Python for Cryptographic Auditing
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # -------------------------------------------------------------
      # Step B: Container Build (Required if scanning container image)
      # -------------------------------------------------------------
      - name: Build Docker Image
        run: docker build -t my-app:local .

      # -------------------------------------------------------------
      # Step C: SBOM Generation (Syft via anchore/sbom-action)
      # -------------------------------------------------------------
      - name: Generate CycloneDX & SPDX SBOM from Container Image
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          image: my-app:local
          format: cyclonedx-json
          output-file: oss/sbom.cyclonedx.json

      - name: Generate SPDX SBOM from Container Image
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          image: my-app:local
          format: spdx-json
          output-file: oss/sbom.spdx.json

      # -------------------------------------------------------------
      # Step D: OCI 1.1 / ORAS Upstream CBOM Discovery
      # Queries the registry for pre-attached vendor CBOMs before running analysis.
      # -------------------------------------------------------------
      - name: Discover Pre-Attached Upstream CBOMs via OCI 1.1 Referrers API
        id: oci-cbom
        run: |
          FETCHED_OCI=false
          if [ -f scripts/fetch_oci_cbom.py ]; then
            if python3 scripts/fetch_oci_cbom.py my-app:local -o oss/upstream_cbom.json; then
              echo "✅ Discovered attached upstream vendor CBOM via OCI Referrers API / ORAS."
              FETCHED_OCI=true
            fi
          fi
          echo "fetched_oci=${FETCHED_OCI}" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------
      # Step E: First-Party / Fallback CBOM Generation (cbomkit-action)
      # Only runs when vendor CBOM is absent or to inventory local code.
      # -------------------------------------------------------------
      - name: Generate CBOM with CBOMkit
        uses: cbomkit/cbomkit-action@34a3d960625ae7f7f1b59455eff93a96df090eb7 # v2.3.0
        id: cbom
        continue-on-error: true
        env:
          CBOMKIT_OUTPUT_DIR: oss
          CBOMKIT_EXCLUDE: "(^|/)scripts/.*|(^|/)tests/.*"

      - name: Fix permissions for container-generated artifacts
        run: sudo chown -R $(id -u):$(id -g) oss/ || true

      # -------------------------------------------------------------
      # Step F: Dual-Engine Semantic AST Crypto Call-Site Discovery & Reconciliation
      # -------------------------------------------------------------
      - name: Semantic AST Cryptographic Scan & CBOM Reconciliation
        run: |
          if [ -f scripts/scan_crypto_ast.py ]; then
            python3 scripts/scan_crypto_ast.py . \
              --cbom oss/cbom.json \
              --output-json oss/crypto-callsites.json
          fi

      # -------------------------------------------------------------
      # Step G: Automated Verification & Test Harness in CI
      # -------------------------------------------------------------
      - name: Run BOM Verification and Cryptographic Audit Harness
        run: |
          if [ -f scripts/test_boms.sh ]; then
            bash scripts/test_boms.sh oss
          fi

      # -------------------------------------------------------------
      # Step H: Cryptographic Asset Report & PQC Assessment
      # Assimilates upstream vendor CBOMs and known OSS catalog profiles
      # without running heavy analysis on third-party binaries.
      # -------------------------------------------------------------
      - name: Generate Comprehensive Cryptographic Audit & PQC Report
        run: |
          if [ -f scripts/analyze_cbom.py ]; then
            EXT_ARGS=""
            if [ -f oss/upstream_cbom.json ]; then
              EXT_ARGS="--external-cbom oss/upstream_cbom.json"
            fi
            python3 scripts/analyze_cbom.py oss/cbom.json \
              --sbom oss/sbom.cyclonedx.json \
              $EXT_ARGS \
              --json oss/crypto-analysis.json \
              --markdown oss/crypto-summary.md \
              --step-summary
          fi

      # -------------------------------------------------------------
      # Step I: Publish Cryptographic Audit Report to Repository (docs/security)
      # -------------------------------------------------------------
      - name: Publish Cryptographic Audit Report to Repository
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          if [ -f oss/crypto-summary.md ]; then
            mkdir -p docs/security
            cp oss/crypto-summary.md docs/security/CRYPTOGRAPHIC_AUDIT.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/security/CRYPTOGRAPHIC_AUDIT.md
            if git diff --staged --quiet; then
              echo "No changes in cryptographic audit report."
            else
              git commit -m "docs(security): update cryptographic audit & PQC migration report [skip ci]"
              git push
            fi
          fi

      # -------------------------------------------------------------
      # Step J: Optional OCI 1.1 / ORAS Attachment (Push to Registry)
      # -------------------------------------------------------------
      - name: Attach CBOM/SBOM to OCI Registry via ORAS (Optional on Push)
        if: github.event_name == 'push' && env.REGISTRY_IMAGE != ''
        env:
          REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}
        run: |
          if [ -f scripts/attach_oci_bom.sh ]; then
            bash scripts/attach_oci_bom.sh -c oss/cbom.json -s oss/sbom.cyclonedx.json "${REGISTRY_IMAGE}"
          fi

      # -------------------------------------------------------------
      # Step K: Upload Generated Artifacts
      # -------------------------------------------------------------
      - name: Upload BOM Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oss-boms
          path: oss/
          retention-days: 90


