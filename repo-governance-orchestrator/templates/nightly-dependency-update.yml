name: Nightly Dependency Update

on:
  schedule:
    - cron: '0 2 * * *' # Runs at 02:00 UTC daily (~03:00 local)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git for automated commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve PR creation token
        id: pr-token
        env:
          PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          if [ -n "$PAT" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $PAT" https://api.github.com/user || true)
            if [ "$STATUS" = "200" ]; then
              echo "Using verified PERSONAL_ACCESS_TOKEN"
              TOKEN="$PAT"
            else
              echo "PERSONAL_ACCESS_TOKEN is invalid or expired (HTTP $STATUS), falling back to GITHUB_TOKEN"
            fi
          else
            echo "PERSONAL_ACCESS_TOKEN not set, using GITHUB_TOKEN"
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        continue-on-error: true
        with:
          token: ${{ steps.pr-token.outputs.token }}
          commit-message: "chore(deps): update project dependencies"
          title: "Automated Dependency Update"
          body: |
            This PR contains automated dependency updates generated by the nightly workflow.
            The dependencies were updated, and a successful build/test was verified.
          branch: "automated/dependency-updates"
          delete-branch: true
          assignees: "jsoehner"
          labels: "automated-dependency-update"

      - name: Auto-merge Pull Request
        if: steps.create-pr.outputs.pull-request-number
        run: |
          PR_URL="${{ steps.create-pr.outputs.pull-request-url }}"
          echo "Triggering auto-merge for $PR_URL..."
          gh pr merge "$PR_URL" --auto --squash --delete-branch || gh pr merge "$PR_URL" --squash --delete-branch || echo "Auto-merge registered or PR queued for checks"
        env:
          GITHUB_TOKEN: ${{ steps.pr-token.outputs.token }}

      - name: Notify manual PR approval needed
        if: ${{ always() && steps.create-pr.outcome == 'failure' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.issues.create({
              owner,
              repo,
              title: 'Automated dependency branch ready for manual PR',
              body: `The automated dependency branch passed build verification but PR creation failed.\n\nBranch: https://github.com/${owner}/${repo}/tree/automated/dependency-updates\n\nRequested reviewer: @jsoehner`,
              assignees: ['jsoehner'],
              labels: ['dependency-update']
            });
